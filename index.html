const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw,silent){
  try{
    const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(S),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
    const z=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(I)},k,u8(C));
    const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    if(document.getElementById("r")&&document.getElementById("r").checked){try{localStorage.setItem("dpw",pw)}catch(e){}}
    document.open();document.write(html);document.close();
  }catch(e){ if(!silent) document.getElementById("e").textContent="密码不对"; try{localStorage.removeItem("dpw")}catch(_){} }
}
